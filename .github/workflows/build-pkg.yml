name: Build Arch Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel git sudo

      - uses: actions/checkout@v4

      - name: Set up builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build python-chinese-calendar
        run: |
          su builder -c "cd $GITHUB_WORKSPACE/aur/python-chinese-calendar && makepkg -s --noconfirm"

      - name: Install python-chinese-calendar
        run: pacman -U --noconfirm aur/python-chinese-calendar/*.pkg.tar.zst

      - name: Build curfew
        run: |
          su builder -c "cd $GITHUB_WORKSPACE/aur/curfew && makepkg -s --noconfirm"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: aur/*/*.pkg.tar.zst
          if-no-files-found: error
